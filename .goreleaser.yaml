version: 2

project_name: k2a-token-sync

builds:
  - id: k2a-token-sync
    main: ./cmd
    binary: k2a-token-sync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/krisiasty/k2a-token-sync:{{ .Tag }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/krisiasty/k2a-token-sync"

  - id: arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/krisiasty/k2a-token-sync:{{ .Tag }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/krisiasty/k2a-token-sync"

docker_manifests:
  - name_template: "ghcr.io/krisiasty/k2a-token-sync:{{ .Tag }}"
    image_templates:
      - "ghcr.io/krisiasty/k2a-token-sync:{{ .Tag }}-amd64"
      - "ghcr.io/krisiasty/k2a-token-sync:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/krisiasty/k2a-token-sync:latest"
    image_templates:
      - "ghcr.io/krisiasty/k2a-token-sync:{{ .Tag }}-amd64"
      - "ghcr.io/krisiasty/k2a-token-sync:{{ .Tag }}-arm64"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
