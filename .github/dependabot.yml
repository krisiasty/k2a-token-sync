version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"

  # Rewrites the SHA pins in .github/workflows, and the version comment beside
  # each one. Without it, pinning to a commit would mean the pins quietly aged
  # instead of the tags quietly moving.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  # Both Dockerfiles are pinned by digest, so nothing else would ever pick up a
  # rebuilt base image — including one rebuilt to carry a security fix. This is
  # what turns the pin from a way of freezing into a way of reviewing.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
