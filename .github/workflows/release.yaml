name: Release

on:
  push:
    tags:
      - "v*"
  # The dry run below, on demand. Nothing about a release is exercised by
  # ordinary CI, so without this the first time the release path runs is the time
  # it matters, and a failure part way through leaves images in ghcr.io for a
  # version that has no release — GoReleaser pushes images before it creates one.
  workflow_dispatch:

# Read-only by default, so a job has to ask for anything more. Only the job that
# actually publishes asks.
permissions:
  contents: read

# Every external action is pinned to a full commit SHA rather than a tag. This is
# the workflow where it matters most: it runs with a token that can create
# releases and push images, so a tag moved upstream would be a way to publish
# artifacts nobody in this repository reviewed. The trailing comment is the
# release that SHA is, and is what Dependabot rewrites when it bumps the pin.
#
# The tools those actions would otherwise download are pinned by checksum in
# .github/actions/release-tools, which both jobs below use.
jobs:
  release:
    name: release
    if: github.event_name == 'push'
    # A broken Windows build has to stop the release before GoReleaser pushes
    # anything, not be discovered afterwards: images land in ghcr.io before the
    # GitHub release is created, so a failure past this point leaves artifacts
    # for a version that was never released.
    needs: windows
    runs-on: ubuntu-latest

    permissions:
      contents: write  # create GitHub release
      packages: write  # push to ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          # Without this, checkout leaves the token in .git/config where every
          # later step can read it. Nothing here needs it: GoReleaser reads the
          # changelog from local history, publishes over the API with the token
          # passed to its step, and pushes images with the registry login.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: verify third-party licenses and notices
        run: |
          ./hack/gen-notices.sh
          git diff --exit-code -- internal/legal/THIRD_PARTY_NOTICES
          git ls-files --error-unmatch internal/legal/THIRD_PARTY_NOTICES

      - uses: ./.github/actions/release-tools

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Everything the release job does short of publishing: the same checkout, the
  # same pinned tools, the same binaries and the same multi-arch image builds
  # through the pinned Buildx and BuildKit. Snapshot mode needs no tag, and the
  # docker build runs in GoReleaser's build phase while only the push lives in
  # publish — so skipping publish still exercises the part worth exercising.
  #
  # It reads git history the way the real changelog does, which is what makes it
  # a genuine test of running with no persisted git credential.
  #
  # No write permissions and no registry login: this proves the release path
  # works without holding the ability to use it.
  dry-run:
    name: dry run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: verify third-party licenses and notices
        run: |
          ./hack/gen-notices.sh
          git diff --exit-code -- internal/legal/THIRD_PARTY_NOTICES
          git ls-files --error-unmatch internal/legal/THIRD_PARTY_NOTICES

      - uses: ./.github/actions/release-tools

      # --snapshot already implies --skip=publish. Both are given because this job
      # is one flag away from publishing for real, and that is not a thing to leave
      # implied.
      - name: build a release without publishing it
        run: goreleaser release --snapshot --clean --skip=publish

  # Windows is verified here rather than on every commit. Nothing in this
  # project is Windows-specific except the released binary and its archive, so
  # a six-minute Windows runner on every push bought coverage of a surface that
  # only changes when a release does. It runs on the tag push that publishes,
  # and on the manual dry run, which are the two moments the answer matters.
  #
  # The release job above waits for it: a Windows build discovered broken after
  # GoReleaser has pushed images is a version that exists in ghcr.io and cannot
  # be released cleanly.
  windows:
    name: windows
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: -v

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # Build Windows binary and verify command-line interfaces
      - name: build Windows binary
        run: |
          go build -o k2a-token-sync.exe ./cmd

      - name: smoke test version command
        run: ./k2a-token-sync.exe version

      - name: smoke test bootstrap help
        run: ./k2a-token-sync.exe bootstrap --help

      - name: smoke test remove help
        run: ./k2a-token-sync.exe remove --help

      - name: smoke test licenses command
        run: ./k2a-token-sync.exe licenses

      # Verify goreleaser produces Windows artifacts correctly
      - name: verify goreleaser Windows build
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          # `goreleaser build` only runs the build pipeline and never produces
          # archives — the zip/tar.gz output only comes out of `release`. Skip
          # docker: this runner has no Linux buildx backend to build the
          # images, and --snapshot already skips announce/publish/validate,
          # so nothing is actually published.
          goreleaser release --snapshot --clean --skip=docker
          # Verify Windows zip archives contain expected files. The archive
          # name embeds the snapshot version (e.g. 0.11.0-SNAPSHOT-<sha>), so
          # match by suffix rather than a hardcoded name.
          $requiredFiles = @("k2a-token-sync.exe", "LICENSE", "NOTICE", "README.md", "THIRD_PARTY_NOTICES")
          foreach ($arch in @("amd64", "arm64")) {
            $zipFile = Get-ChildItem "dist/*_windows_${arch}.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $zipFile) {
              Write-Error "Windows archive for $arch not created"
              Get-ChildItem "dist/*.zip" | Select-Object Name
              exit 1
            }
            $extractDir = "dist/verify-windows-$arch"
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Expand-Archive -Path $zipFile.FullName -DestinationPath $extractDir
            $files = Get-ChildItem $extractDir -Name
            foreach ($reqFile in $requiredFiles) {
              if ($reqFile -notin $files) {
                Write-Error "Windows archive for $arch missing $reqFile. Found: $($files -join ', ')"
                exit 1
              }
            }
          }
          Write-Host "All Windows archives verified successfully"

      # Verify licenses command output contains third-party notices
      - name: verify licenses output
        run: |
          $licensesOutput = ./k2a-token-sync.exe licenses
          if (-not ($licensesOutput -match "third-party notices")) {
            Write-Error "licenses command output does not contain expected notice header"
            exit 1
          }
          if (-not ($licensesOutput -match "google/go-licenses")) {
            Write-Error "licenses command output does not contain go-licenses attribution"
            exit 1
          }
          Write-Host "licenses output verified successfully"
