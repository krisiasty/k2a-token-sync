name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default, so a job added later has to ask for anything more. The
# release job below is the only one that publishes, and it holds the write
# permissions on its own rather than the whole workflow doing so.
permissions:
  contents: read

# Every external action is pinned to a full commit SHA rather than a tag. This is
# the workflow where it matters most: it runs with a token that can create
# releases and push images, so a tag moved upstream would be a way to publish
# artifacts nobody in this repository reviewed. The trailing comment is the
# release that SHA is, and is what Dependabot rewrites when it bumps the pin.
jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # create GitHub release
      packages: write  # push to ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          # Without this, checkout leaves the token in .git/config where every
          # later step can read it. Nothing here needs it: GoReleaser reads the
          # changelog from local history, publishes over the API with the token
          # passed to its step, and pushes images with the registry login.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # setup-buildx otherwise reuses the runner's moving Buildx binary, or
      # downloads a replaceable release asset when none is installed. Verify the
      # exact asset before putting it where the pinned action will find it.
      - name: install buildx
        env:
          BUILDX_VERSION: v0.36.0
          BUILDX_SHA256: 07823fdfcd82a41be90155a8b16876c1a780a6462de805a9f3f63b3119ccfb99
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/docker-buildx"
          url="https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 "${url}" --output "${binary}"
          printf '%s  %s\n' "${BUILDX_SHA256}" "${binary}" | sha256sum --check --strict
          install -D -m 0755 "${binary}" "${HOME}/.docker/cli-plugins/docker-buildx"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # The docker-container driver defaults to the mutable
          # moby/buildkit:buildx-stable-1 tag. Keep the readable release tag, but
          # make the registry resolve this exact multi-platform image index.
          driver-opts: image=moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2

      # GoReleaser's action checks the archive against checksums.txt from the same
      # replaceable release, then silently skips its signature when cosign is not
      # on the runner. A committed digest makes substitution fail closed.
      - name: install goreleaser
        env:
          GORELEASER_VERSION: v2.17.1
          GORELEASER_SHA256: a99bbc7ae0d8d897b07c4c497a9b62f222558804715ef219d1af05a7e417bc80
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/goreleaser.tar.gz"
          tool_dir="${RUNNER_TEMP}/goreleaser"
          url="https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 "${url}" --output "${archive}"
          printf '%s  %s\n' "${GORELEASER_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${tool_dir}"
          tar -xzf "${archive}" -C "${tool_dir}" goreleaser
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
