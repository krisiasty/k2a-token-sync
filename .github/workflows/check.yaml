name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 8 * * 1"  # weekly on monday — catches new vulnerabilities
  # workflow_dispatch goes through the REST API rather than a webhook
  # delivery, so a run can still be started by hand when push/pull_request
  # webhooks are delayed or dropped (e.g. during a GitHub Actions incident).
  workflow_dispatch: {}

permissions:
  contents: read

# Every external action is pinned to a full commit SHA rather than a tag, because
# a tag is movable: whoever can push one can change what runs here, and this
# workflow's sibling holds the token that publishes releases. The trailing comment
# is the release that SHA is, and is what Dependabot rewrites when it bumps the pin.
#
# The tools an action downloads are pinned too, since a pinned action that fetches
# "latest" still runs unreviewed code. Dependabot does not touch those version
# inputs, so they are bumped by hand — the trade for a CI run that is the same
# tomorrow as it was today.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      - name: third-party licenses are allowed and notices are current
        run: |
          ./hack/gen-notices.sh
          git diff --exit-code -- internal/legal/THIRD_PARTY_NOTICES
          git ls-files --error-unmatch internal/legal/THIRD_PARTY_NOTICES

      # The CRD schema is generated from api/v1alpha1, so a field added to the
      # Go types without regenerating would be pruned by the API server rather
      # than reported. Same idea as the go mod tidy check above.
      - name: crd schema is current
        run: |
          ./hack/gen-crd.sh
          git diff --exit-code -- charts/k2a-token-sync-crds/files

      - name: shellcheck
        run: shellcheck hack/*.sh

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: -v

      # Pinned the same way controller-gen is in hack/gen-crd.sh, and for the same
      # reason: 'go run pkg@version' resolves in isolation and touches neither
      # go.mod nor the module graph. Pinning the scanner does not stale what it
      # finds — the vulnerability database is fetched from vuln.go.dev at run time,
      # so only the analysis improves with a bump, never the data.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12

  chart:
    name: chart
    runs-on: ubuntu-latest

    # image.tag is a required value, so every render has to supply one. The
    # value itself is irrelevant here — these steps check that the templates
    # render, not which version is deployed.
    env:
      TAG: v0.0.1

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: helm lint
        run: helm lint charts/k2a-token-sync --set "image.tag=${TAG}"

      # image.tag is required; rendering without one must fail rather than
      # silently produce an image reference ending in a colon.
      - name: helm template rejects a missing image.tag
        run: |
          if helm template k2a-token-sync charts/k2a-token-sync \
               --namespace k2a-token-sync > /dev/null 2>&1; then
            echo "::error::rendering succeeded without image.tag"
            exit 1
          fi

      # A template file present locally but never committed renders fine on the
      # machine that wrote it and vanishes here — which is exactly how the Service
      # went missing from its own pull request. Naming the objects the chart is
      # supposed to ship turns that into a failed build instead of a promise in the
      # README that nothing keeps.
      - name: the chart ships every object it claims to
        run: |
          set -euo pipefail
          rendered=$(helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}" --include-crds)
          # A here-string rather than a pipe into grep -q: grep exits on the first
          # match, the writer takes SIGPIPE, and under pipefail the pipeline reports
          # 141 for a check that actually succeeded.
          for kind in ClusterRole ClusterRoleBinding Deployment Role RoleBinding Service ServiceAccount; do
            if ! grep -qx "kind: ${kind}" <<<"${rendered}"; then
              echo "::error::the app chart rendered no ${kind}"
              exit 1
            fi
          done
          # The CRD moved to its own chart, so the app chart must no longer
          # carry one. Rendering both would mean two releases fighting over a
          # cluster-scoped object.
          if grep -qx "kind: CustomResourceDefinition" <<<"${rendered}"; then
            echo "::error::the app chart still renders a CustomResourceDefinition"
            exit 1
          fi

      # The schema now ships separately, so nothing above would notice it going
      # missing — which is the same gap the check above exists to close.
      - name: the crds chart ships the schema, and protects it
        run: |
          set -euo pipefail
          rendered=$(helm template k2a-token-sync-crds charts/k2a-token-sync-crds)
          if ! grep -qx "kind: CustomResourceDefinition" <<<"${rendered}"; then
            echo "::error::the crds chart rendered no CustomResourceDefinition"
            exit 1
          fi
          # Losing either annotation means a helm uninstall or a deleted ArgoCD
          # Application takes every ClusterConnection with it, and each one is
          # the only record of a cluster's registration.
          for annotation in "helm.sh/resource-policy: keep" "argocd.argoproj.io/sync-options: Delete=false,Prune=false"; do
            if ! grep -qF "${annotation}" <<<"${rendered}"; then
              echo "::error::the CRD is missing its deletion guard: ${annotation}"
              exit 1
            fi
          done
          # And the toggle has to actually toggle, or the value is decoration.
          off=$(helm template k2a-token-sync-crds charts/k2a-token-sync-crds --set crds.keep=false)
          if grep -qF "helm.sh/resource-policy: keep" <<<"${off}"; then
            echo "::error::crds.keep=false still rendered the keep policy"
            exit 1
          fi

      # The alert rules are off by default, so the step above cannot see them and
      # a template that was never committed would render fine locally and vanish
      # here — the same failure that check exists for. Both directions matter:
      # absent when asked for is a missing feature, present when not asked for
      # would break every install without prometheus-operator's CRDs.
      - name: the alert rules render only when asked for
        run: |
          set -euo pipefail
          off=$(helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}")
          if grep -qx "kind: PrometheusRule" <<<"${off}"; then
            echo "::error::the chart rendered a PrometheusRule without prometheusRule.enabled"
            exit 1
          fi
          on=$(helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}" \
            --set prometheusRule.enabled=true)
          if ! grep -qx "kind: PrometheusRule" <<<"${on}"; then
            echo "::error::prometheusRule.enabled=true rendered no PrometheusRule"
            exit 1
          fi
          # Every metric the endpoint exposes should be alerted on, and a rule
          # naming a metric that does not exist would fire never and be noticed
          # by nobody. This ties the two files together.
          for metric in \
            k2a_token_sync_cluster_ready \
            k2a_token_sync_cluster_token_expiration_timestamp_seconds \
            k2a_token_sync_cluster_self_credential_expiration_timestamp_seconds \
            k2a_token_sync_cluster_serving_cert_expiration_timestamp_seconds \
            k2a_token_sync_cluster_last_sync_timestamp_seconds; do
            if ! grep -q "${metric}" <<<"${on}"; then
              echo "::error::no alert rule references ${metric}"
              exit 1
            fi
            if ! grep -rq "\"${metric}\"" cmd/metrics.go; then
              echo "::error::alert rules reference ${metric}, which cmd/metrics.go does not export"
              exit 1
            fi
          done

      - name: restricted RBAC remains restricted across renders
        run: |
          set -euo pipefail
          unrestricted=$(helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}")
          if ! grep -qF 'verbs: ["create", "patch"]' <<<"${unrestricted}"; then
            echo "::error::the default chart no longer grants the existing create/patch policy"
            exit 1
          fi

          for pass in first upgrade; do
            restricted=$(helm template k2a-token-sync charts/k2a-token-sync \
              --namespace k2a-token-sync --set "image.tag=${TAG}" \
              --set restrictedRBAC.enabled=true)
            if grep -qF 'verbs: ["create", "patch"]' <<<"${restricted}"; then
              echo "::error::restricted render ${pass} restored namespace-wide patch"
              exit 1
            fi
            if ! grep -qF 'verbs: ["create"]' <<<"${restricted}"; then
              echo "::error::restricted render ${pass} lost namespace-wide create"
              exit 1
            fi
          done

          if helm template k2a-token-sync charts/k2a-token-sync \
               --namespace argocd --set "image.tag=${TAG}" \
               --set restrictedRBAC.enabled=true > /dev/null 2>&1; then
            echo "::error::restricted mode rendered for a same-namespace deployment"
            exit 1
          fi

      - name: helm template
        run: |
          helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}" > /dev/null
          # Helm skips crds/ unless asked, so a malformed generated CRD would
          # otherwise only surface at install time.
          helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}" --include-crds > /dev/null
          # Deploying into ArgoCD's own namespace must not render a duplicate Role.
          helm template k2a-token-sync charts/k2a-token-sync \
            --namespace argocd --set "image.tag=${TAG}" > /dev/null
