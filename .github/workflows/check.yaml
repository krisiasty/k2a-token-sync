name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 8 * * 1"  # weekly on monday — catches new vulnerabilities

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      # The CRD schema is generated from api/v1alpha1, so a field added to the
      # Go types without regenerating would be pruned by the API server rather
      # than reported. Same idea as the go mod tidy check above.
      - name: crd schema is current
        run: |
          ./hack/gen-crd.sh
          git diff --exit-code -- charts/k2a-token-sync/crds

      - name: shellcheck
        run: shellcheck hack/*.sh

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: -v

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: typos
        uses: crate-ci/typos@v1

      - name: actionlint
        uses: raven-actions/actionlint@v2

  chart:
    name: chart
    runs-on: ubuntu-latest

    # image.tag is a required value, so every render has to supply one. The
    # value itself is irrelevant here — these steps check that the templates
    # render, not which version is deployed.
    env:
      TAG: v0.0.1

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup helm
        uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint charts/k2a-token-sync --set "image.tag=${TAG}"

      # image.tag is required; rendering without one must fail rather than
      # silently produce an image reference ending in a colon.
      - name: helm template rejects a missing image.tag
        run: |
          if helm template k2a-token-sync charts/k2a-token-sync \
               --namespace k2a-token-sync > /dev/null 2>&1; then
            echo "::error::rendering succeeded without image.tag"
            exit 1
          fi

      - name: helm template
        run: |
          helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}" > /dev/null
          # Helm skips crds/ unless asked, so a malformed generated CRD would
          # otherwise only surface at install time.
          helm template k2a-token-sync charts/k2a-token-sync \
            --namespace k2a-token-sync --set "image.tag=${TAG}" --include-crds > /dev/null
          # Deploying into ArgoCD's own namespace must not render a duplicate Role.
          helm template k2a-token-sync charts/k2a-token-sync \
            --namespace argocd --set "image.tag=${TAG}" > /dev/null
