apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k2a-token-sync.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "k2a-token-sync.selectorLabels" . | nindent 6 }}
  # Recreate, not RollingUpdate: two instances reconciling the same clusters
  # would race to mint and publish credentials.
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "k2a-token-sync.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "k2a-token-sync.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k2a-token-sync
          image: {{ include "k2a-token-sync.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The inventory comes from ClusterConnection objects in this
            # namespace, so there is no config file to point at.
            - name: ARGOCD_NAMESPACE
              value: {{ include "k2a-token-sync.argocdNamespace" . | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.health.port | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            # A cluster that cannot be reached leaves the pod unready; allow a
            # generous window before that shows up, since every cluster in the
            # inventory has to reconcile once first.
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
