{{- $name := include "k2a-token-sync.name" . }}
{{- $argocdNamespace := include "k2a-token-sync.argocdNamespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
# In its own namespace k2a-token-sync reads its inventory and holds the credential it
# provisioned for each cluster. This namespace contains nothing but k2a-token-sync's
# own objects.
#
# ClusterConnections are namespaced and only this namespace is listed, so a Role
# suffices: k2a-token-sync holds no cluster-scoped permission anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["k2a-token-sync.io"]
    resources: ["clusterconnections"]
    verbs: ["get", "list"]
  - apiGroups: ["k2a-token-sync.io"]
    resources: ["clusterconnections/status"]
    verbs: ["get", "update", "patch"]
  # Events for the handful of things that are genuinely events rather than states
  # — a credential reissued, a downstream identity restored — so that they show up
  # in 'kubectl describe ccon' rather than only in this process's logs.
  #
  # Create only. Each event is a new object, and k2a-token-sync neither reads them
  # back nor aggregates them into a series.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if ne $argocdNamespace .Release.Namespace }}
---
# ArgoCD's namespace, where the generated cluster Secrets live.
#
# k2a-token-sync holds create and patch here, and nothing else. In particular it
# cannot read: not the Secrets it writes, not ArgoCD's own. It learns the result
# of its own writes from what an apply returns, and records everything else in
# each ClusterConnection's status.
#
# These verbs are namespace-wide because they have to be. Cluster names are not
# known when this Role is created — that is the entire point of an inventory that
# changes at runtime — and RBAC cannot scope resourceNames by prefix. Two things
# limit what that permits: secretName must begin with "cluster-", so a connection
# cannot be aimed at ArgoCD's own Secrets, and the absence of delete means nothing
# here can be removed by k2a-token-sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $argocdNamespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $argocdNamespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# The one cluster-scoped permission k2a-token-sync holds on the cluster it runs
# in, and it is a single read.
#
# It is here so the tool can compare the CRD's schema against the fields this
# binary knows about. Helm never upgraded a crds/ directory, so a schema could
# fall behind the binary; the API server then prunes spec fields it does not
# recognise, and a connection asking for a restricted clusterRole silently
# resolves to cluster-admin instead. Nothing else can notice that: from inside,
# a pruned field is indistinguishable from one nobody set.
#
# resourceNames is what keeps this narrow, and is not decoration: without it
# this would read every CRD in the cluster rather than the one it owns. Even
# so, the marginal exposure is nil — the built-in system:discovery role already
# lets every authenticated identity read the same schema through /openapi, so
# this grants access to nothing that was not already reachable. What it buys is
# a stable API and no dependency on an OpenAPI naming convention.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["clusterconnections.k2a-token-sync.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
