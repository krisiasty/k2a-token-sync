{{- $name := include "k2a-token-sync.name" . }}
{{- $argocdNamespace := include "k2a-token-sync.argocdNamespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
# In its own namespace the daemon reads any bootstrap credentials and stores the
# durable credentials it provisions for each cluster. This namespace holds
# nothing but the daemon's own secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if ne $argocdNamespace .Release.Namespace }}
---
# ArgoCD's namespace, where the generated cluster Secrets live. 'create' cannot
# be scoped with resourceNames, so it is granted namespace-wide; read and write
# access is restricted to the Secrets this release manages, so the daemon cannot
# read ArgoCD's own secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $argocdNamespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- if .Values.clusters }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range .Values.clusters }}
      - {{ .secretName | default (printf "cluster-%s" .name) }}
      {{- end }}
    verbs: ["get", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $argocdNamespace }}
  labels:
    {{- include "k2a-token-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
