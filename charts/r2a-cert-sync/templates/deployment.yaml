apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "r2a-cert-sync.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "r2a-cert-sync.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "r2a-cert-sync.selectorLabels" . | nindent 6 }}
  # Recreate, not RollingUpdate: two instances reconciling the same clusters
  # would race to mint and publish credentials.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # Restart on config change so a ConfigMap edit takes effect immediately
        # rather than at the next reconciliation.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "r2a-cert-sync.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "r2a-cert-sync.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: r2a-cert-sync
          image: {{ include "r2a-cert-sync.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_PATH
              value: /etc/r2a-cert-sync/config.yaml
            - name: HEALTH_PORT
              value: {{ .Values.health.port | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/r2a-cert-sync
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            # A cluster that cannot be reached leaves the pod unready; allow a
            # generous window before that shows up, since the first pass has to
            # reach every configured cluster.
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "r2a-cert-sync.name" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
