crds:
  # Keep the CustomResourceDefinition when this release is removed.
  #
  # Deleting it deletes every ClusterConnection with it, and each one is the
  # only record of a cluster's registration: recovering means re-running
  # bootstrap against every downstream cluster, with administrative credentials
  # for each. That is not something a mistyped 'helm uninstall' or a deleted
  # ArgoCD Application should be able to cause.
  #
  # Two annotations, because the two deployment paths read different ones.
  # helm.sh/resource-policy is interpreted by 'helm uninstall' and is invisible
  # to ArgoCD, which never runs it — it renders with 'helm template', applies
  # the output, and prunes from its own resource tracking.
  #
  # The helm half is verified: uninstalling this release leaves the CRD and
  # every ClusterConnection in place. The ArgoCD half is not. Deleting an
  # Application that had synced this chart deleted nothing either way, with the
  # annotation and without it, because ArgoCD stamped no tracking marker on the
  # CRD and so found nothing of its own to cascade to. It is kept because it is
  # correct practice and costs nothing, not because it has been shown to be
  # load-bearing — see the README's ArgoCD section.
  #
  # Turning this off is the deliberate act that makes the CRD removable.
  keep: true
