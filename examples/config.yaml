# Example cluster inventory.
#
# This is the file the daemon reads (CONFIG_PATH, /etc/k2a-token-sync/config.yaml
# by default). With the Helm chart you do not write it by hand — the chart
# renders it into a ConfigMap from the `clusters` list in your values, and
# derives the RBAC from the same list. This file documents the resulting format,
# and internal/config parses it in a test so it cannot drift from the loader.
#
# Namespace of the ArgoCD instance this daemon serves. Every generated cluster
# Secret is written here.
argocdNamespace: argocd

# Rancher is used on the control path only: to reach downstream clusters so
# credentials can be provisioned, and to trigger certificate rotation. ArgoCD
# never talks to Rancher — it connects to each endpoint directly.
# Omit this section entirely if every cluster uses provider "direct".
rancher:
  url: "https://rancher.example.com"
  tokenSecret:
    name: rancher-credentials
    key: token

# The first two describe the credential the daemon issues; the last two
# describe the downstream API server's own serving certificate. They are
# unrelated measurements that happen to share units.
defaults:
  tokenTTL: "720h"             # 30d — ArgoCD's credential; reissued at half life
  refreshInterval: "24h"       # upper bound; shortened if a token is capped
  expiryWarnThreshold: "2160h" # 90d — matches RKE2's own rotate-on-restart window
  rotateThreshold: "720h"      # 30d — where autoRotate is enabled
  serviceAccount:
    name: argocd-manager
    namespace: kube-system

clusters:
  # Managed by Rancher: no bootstrap needed. Rancher's cluster agent is
  # already privileged downstream, so the daemon provisions everything itself.
  - name: downstream-1
    provider: rancher
    endpoint: "10.0.0.10"     # direct API address; :6443 is the default
    secretName: cluster-downstream-1
    autoRotate: false         # true lets the daemon restart the control plane

  # Standalone RKE2: bootstrap once with
  #   k2a-token-sync bootstrap --cluster standalone-1 \
  #     --endpoint 10.1.0.10 --context standalone-1
  # after which no bootstrapSecret is needed. Alternatively, supply
  # bootstrap material and let the daemon do it on first contact:
  #   bootstrapSecret:
  #     name: standalone-1-bootstrap
  #     key: kubeconfig
  - name: standalone-1
    provider: direct
    endpoint: "10.1.0.10"
    secretName: cluster-standalone-1
