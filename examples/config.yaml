# Example cluster inventory.
#
# This is the file the daemon reads (CONFIG_PATH, /etc/k2a-token-sync/config.yaml
# by default). With the Helm chart you do not write it by hand — the chart
# renders it into a ConfigMap from the `clusters` list in your values, and
# derives the RBAC from the same list. This file documents the resulting format,
# and internal/config parses it in a test so it cannot drift from the loader.
#
# Namespace of the ArgoCD instance this daemon serves. Every generated cluster
# Secret is written here.
argocdNamespace: argocd

# The first describes the credential the daemon issues for ArgoCD; the second
# describes the API server's own serving certificate. They are unrelated
# measurements that happen to share units.
defaults:
  tokenTTL: "720h"             # 30d — ArgoCD's credential; reissued at half life
  refreshInterval: "24h"       # upper bound; shortened if a token is capped
  expiryWarnThreshold: "2160h" # 90d — notice before the serving certificate expires
  serviceAccount:
    name: argocd-manager
    namespace: kube-system

clusters:
  # Bootstrap each cluster once with
  #   k2a-token-sync bootstrap --cluster standalone-1 \
  #     --endpoint 10.1.0.10 --context standalone-1
  # after which no bootstrapSecret is needed. Alternatively, supply bootstrap
  # material and let the daemon do it on first contact:
  #   bootstrapSecret:
  #     name: standalone-1-bootstrap
  #     key: kubeconfig
  - name: standalone-1
    endpoint: "10.1.0.10"     # direct API address; :6443 is the default
    secretName: cluster-standalone-1

  - name: standalone-2
    endpoint: "cluster2.example.com:6443"
    secretName: cluster-standalone-2
    tokenTTL: "168h"          # 7d — this cluster overrides the default
