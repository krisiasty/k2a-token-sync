# Cluster inventory. Editing this ConfigMap is the only step needed to add or
# remove a downstream cluster — restart the deployment afterwards, or wait for
# the next reconciliation to pick up the projected change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: r2a-cert-sync
  namespace: r2a-cert-sync
data:
  config.yaml: |
    # Rancher is used on the control path only: to reach downstream clusters so
    # credentials can be provisioned, and to trigger certificate rotation.
    # ArgoCD never talks to Rancher — it connects to each endpoint directly.
    # Omit this section entirely if every cluster uses provider "direct".
    rancher:
      url: "https://rancher.example.com"
      tokenSecret:
        name: rancher-credentials
        key: token

    defaults:
      tokenTTL: "720h"            # credential lifetime requested for ArgoCD
      refreshInterval: "24h"      # how often every cluster is reconciled
      expiryWarnThreshold: "720h" # warn below this much serving-cert lifetime
      rotateThreshold: "720h"     # rotate below this, where autoRotate is on
      secretNamespace: "argocd"
      serviceAccount:
        name: argocd-manager
        namespace: kube-system

    clusters:
      # Managed by Rancher: no bootstrap needed. Rancher's cluster agent is
      # already privileged downstream, so the daemon provisions everything itself.
      - name: downstream-1
        provider: rancher
        endpoint: "10.0.0.10"     # direct API address; :6443 is the default
        secretName: cluster-downstream-1
        secretNamespace: argocd
        autoRotate: false         # true lets the daemon restart the control plane

      # Standalone RKE2: bootstrap once with
      #   r2a-cert-sync bootstrap --cluster standalone-1 \
      #     --endpoint 10.1.0.10 --context standalone-1
      # after which no bootstrapSecret is needed. Alternatively, supply
      # bootstrap material and let the daemon do it on first contact:
      #   bootstrapSecret:
      #     name: standalone-1-bootstrap
      #     key: kubeconfig
      - name: standalone-1
        provider: direct
        endpoint: "10.1.0.10"
        secretName: cluster-standalone-1
        secretNamespace: argocd
