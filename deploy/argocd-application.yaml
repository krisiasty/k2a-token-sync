# Deploys r2a-cert-sync with ArgoCD itself. Note the bootstrap ordering: ArgoCD
# manages the daemon on the local cluster, and the daemon in turn maintains
# ArgoCD's registrations for every downstream cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: r2a-cert-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krisiasty/r2a-cert-sync
    targetRevision: HEAD
    path: charts/r2a-cert-sync
    helm:
      values: |
        image:
          tag: "v0.1.0"

        rancher:
          url: "https://rancher.example.com"
          tokenSecret:
            name: rancher-credentials

        clusters:
          - name: downstream-1
            provider: rancher
            endpoint: "10.0.0.10"
            autoRotate: false

          - name: standalone-1
            provider: direct
            endpoint: "10.1.0.10"
  destination:
    server: https://kubernetes.default.svc
    namespace: r2a-cert-sync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
